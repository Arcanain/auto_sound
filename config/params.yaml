auto_sound_node:
  ros__parameters:
    frame_id: map
    child_frame_id: base_link
    publish_rate_hz: 30.0
    speed_mps: 1.2
    start_x: 0.0
    start_y: 0.0
    start_yaw: 0.0
    auto_align_start_yaw: true
    waypoint_tolerance: 0.3
    max_yaw_rate: 0.9
    car_length: 1.8
    car_width: 0.8
    car_height: 0.7
    car_color_rgba: [0.1, 0.6, 0.9, 1.0]
    path_width: 0.15
    path_color_rgba: [1.0, 0.7, 0.1, 1.0]
    obstacle_x: -7.5
    obstacle_y: 10.0
    obstacle_radius: 0.6
    obstacle_height: 1.2
    obstacle_color_rgba: [0.85, 0.2, 0.2, 1.0]
    detection_radius: 2.0
    detection_line_width: 0.05
    detection_color_rgba: [1.0, 0.95, 0.3, 0.35]
    # x1, y1, x2, y2, ...
    path_points: [0.0, 0.0, 0.0, 10.0, -15.0, 10.0, -15.0, 20.0]
    enable_sound: true
    audio_player: auto
    start_sound: start.wav
    goal_sound: goal.wav
    enable_turn_sound: true
    turn_announce_distance: 1.5
    turn_min_angle_deg: 20.0
    left_sound: left.wav
    right_sound: right.wav
    enable_obstacle_sound: true
    obstacle_sound: obstacle.wav
    obstacle_topic: obstacle_detected
    obstacle_auto_detect: true

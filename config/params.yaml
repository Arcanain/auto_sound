auto_sound_node:
  ros__parameters:
    frame_id: map
    publish_rate_hz: 30.0
    path_topic: tgt_path
    odom_topic: odom
    obstacle_detected_topic: obstacle_detected

    path_width: 0.15
    path_color_rgba: [1.0, 0.7, 0.1, 1.0]
    detection_radius: 2.0
    detection_line_width: 0.05
    detection_color_rgba: [1.0, 0.95, 0.3, 0.35]

    enable_sound: true
    audio_player: auto
    start_sound: start.wav
    # Start after start_sound finishes, then keep looping independently of cues.
    # YouTube playback uses mpv, or yt-dlp + ffplay as a fallback.
    enable_background_sound: true
    background_sound_source: "https://www.youtube.com/watch?v=nXy8Ns6ywfo&list=RDnXy8Ns6ywfo&start_radio=1"
    background_audio_player: auto
    background_volume: 100.0
    obstacle_sound: obstacle.wav
    obstacle_sound_cooldown_sec: 5.0
    plate_number_topic: plate_number
    plate_repeat_suppression_sec: 1800.0
    plate_prefix_sound: plate_prefix.mp3
    plate_suffix_sound: plate_suffix.mp3
    digit_sound_directory: number

    ordered_cue_radius: 1.0
    ordered_sound_cues:
      - "-7.06949,5.24913,left.wav"
      - "-0.56388,86.4047,left.wav"
      - "-3.88193,100.235,left.wav"
      - "-18.0264,101.467,right.wav"
      - "-97.1574,111.221,left.wav"
      - "-109.494,43.8416,left.wav"
      - "-36.7486,21.0162,left.wav"
      - "-31.0053,25.3745,right.wav"
      - "-7.96139,24.8385,left.wav"
      - "0.256114,32.1872,right.wav"
      - "28.2829,30.0202,stop.wav"
      - "59.5565,37.3161,goal1.wav"
